[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I"]
ignore = ["E501", "E701", "E702"]  # E701/E702: compact one-line model/choice definitions are used deliberately in models.py files
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py","tests.py"]
testpaths = ["tests"]
