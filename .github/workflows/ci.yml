name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Evaluation smoke (mock, no AWS)
        run: python manage.py migrate && python manage.py run_evaluation
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic secret pattern scan (defence-in-depth, not a guarantee)
        run: |
          if grep -RInE "AKIA[0-9A-Z]{16}|BEGIN (RSA |EC )?PRIVATE KEY" --exclude-dir=.git . ; then echo "Possible secret found"; exit 1; fi
          echo "No obvious AWS key / private key patterns found."
